version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hospital_yuska_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: hospital_yuska
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
